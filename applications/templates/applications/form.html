 {% extends 'base.html' %}
{% block content %}
<div class="card shadow-sm mx-auto" style="max-width: 600px;">
  <div class="card-body">
    <h4 class="mb-3">Application</h4>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary">Save</button>
      <a href="{% url 'dashboard' %}" class="btn btn-link">Back</a>
    </form>
  </div>
</div>
{% endblock %}
