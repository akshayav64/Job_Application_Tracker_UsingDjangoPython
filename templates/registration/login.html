 {% extends 'base.html' %}
{% block content %}
<div class="card shadow-sm mx-auto" style="max-width: 420px;">
  <div class="card-body">
    <h4 class="mb-3">Login</h4>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary w-100">Login</button>
    </form>
    <p class="mt-3 mb-0 text-center"><a href="{% url 'signup' %}">Create an account</a></p>
  </div>
</div>
{% endblock %}
